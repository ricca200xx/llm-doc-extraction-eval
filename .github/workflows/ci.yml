name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run pytest -q
      # Re-score the committed model outputs: the README numbers must come from this code.
      - run: uv run docextract report > /dev/null
      - run: git diff --exit-code results/report.md
