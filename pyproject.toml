[project]
name = "docextract-eval"
version = "0.1.0"
description = "Strict, statistically honest evaluation of LLM receipt extraction on the public CORD-v2 dataset."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.6",
    "pyarrow>=15",
    "pillow>=10",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "tenacity>=8",
]

[project.scripts]
docextract = "docextract.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docextract"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
